[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "erdo-magpie"
dynamic = ["version"]
description = "Knowledge store with semantic + keyword search. Dual search, REST + MCP API, management UI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31",
    "fastapi>=0.137",
    "httpx>=0.28",
    "mcp>=1.27",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "python-multipart>=0.0.32",
    "rich>=15",
    "typer>=0.26",
    "uvicorn>=0.49",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
]

[project.scripts]
magpie = "magpie.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["magpie"]

[tool.hatch.version]
path = "magpie/__version__.py"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# viewer.py embeds a static HTML/CSS/JS template; its asset lines are
# legitimately long and not Python to be reflowed.
"magpie/viewer.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
